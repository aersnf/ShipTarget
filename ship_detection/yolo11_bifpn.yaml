# YOLOv11 + BiFPN_EMA 多尺度融合（仅修改颈部，不添加注意力）
nc: 1
depth_multiple: 0.33
width_multiple: 0.50

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  # 自顶向下路径（用 BiFPN_EMA 替换原有的上采样+Concat）
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, BiFPN_EMA, [512, 512, 3]]   # 融合 P4 特征（输入两个特征图）
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, BiFPN_EMA, [256, 256, 3]]   # 融合 P3 特征
  # 自底向上路径（保留原有 Conv + Concat）
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]          # cat head P4
  - [-1, 3, C2f, [512]]                 # 15
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]           # cat head P5
  - [-1, 3, C2f, [1024]]                # 18
  - [[13, 15, 18], 1, Detect, [nc]]     # 检测头（注意索引：13是P3输出，15是P4，18是P5）