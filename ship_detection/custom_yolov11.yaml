# YOLOv11 + MMSA 改进配置文件
# 用于船舰目标检测

# 参数配置
nc: 1                     # 类别数（船舰为1类）
depth_multiple: 0.33      # 深度倍数
width_multiple: 0.50      # 宽度倍数

# 主干网络（集成MMSA注意力）
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C2f, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C2f, [256, True]]          # 4
  - [-1, 1, MMSA, [256, 8, 16]]        # 5 嵌入MMSA注意力
  - [-1, 1, Conv, [512, 3, 2]]         # 6-P4/16
  - [-1, 6, C2f, [512, True]]          # 7
  - [-1, 1, MMSA, [512, 8, 16]]        # 8 嵌入MMSA注意力
  - [-1, 1, Conv, [1024, 3, 2]]        # 9-P5/32
  - [-1, 3, C2f, [1024, True]]         # 10
  - [-1, 1, SPPF, [1024, 5]]           # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 8], 1, Concat, [1]]      # cat backbone P4
  - [-1, 3, C2f, [512]]            # 14
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]      # cat backbone P3
  - [-1, 3, C2f, [256]]            # 17
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]     # cat head P4
  - [-1, 3, C2f, [512]]            # 20
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]     # cat head P5
  - [-1, 3, C2f, [1024]]           # 23
  - [[17, 20, 23], 1, Detect, [nc]]         # 标准 Detect