# YOLOv11 + MMSA 注意力机制（仅添加注意力，不修改颈部）
nc: 1  # 船舰类别数，根据你的数据集修改
depth_multiple: 0.33
width_multiple: 0.50

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, MMSA, [256, 8, 16]]    # 5 在P3后插入MMSA（256通道，8头，压缩比16）
  - [-1, 1, Conv, [512, 3, 2]]     # 6-P4/16
  - [-1, 6, C2f, [512, True]]      # 7
  - [-1, 1, MMSA, [512, 8, 16]]    # 8 在P4后插入MMSA
  - [-1, 1, Conv, [1024, 3, 2]]    # 9-P5/32
  - [-1, 3, C2f, [1024, True]]     # 10
  - [-1, 1, SPPF, [1024, 5]]       # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 8], 1, Concat, [1]]      # cat backbone P4
  - [-1, 3, C2f, [512]]            # 14
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]      # cat backbone P3
  - [-1, 3, C2f, [256]]            # 17
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]     # cat head P4
  - [-1, 3, C2f, [512]]            # 20
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]     # cat head P5
  - [-1, 3, C2f, [1024]]           # 23
  - [[17, 20, 23], 1, Detect, [nc]] # 检测头